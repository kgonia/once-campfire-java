# The Rails image's environment, so the same `docker run` works for both images.
campfire.storage=${CAMPFIRE_STORAGE:/rails/storage}
campfire.secret-key-base=${SECRET_KEY_BASE:}
campfire.disable-ssl=${DISABLE_SSL:false}
campfire.vapid-public-key=${VAPID_PUBLIC_KEY:}
campfire.vapid-private-key=${VAPID_PRIVATE_KEY:}
campfire.vapid-subject=${VAPID_SUBJECT:mailto:support@37signals.com}
campfire.app-version=${APP_VERSION:${GIT_REVISION:0}}
campfire.git-revision=${GIT_REVISION:}
campfire.response-cache-mb=${CAMPFIRE_RESPONSE_CACHE_MB:64}

# SQLite, opened as the reference's config/database.yml and Rails' adapter do (the driver reads
# pragmas from the URL; open_mode is READWRITE | CREATE | NOMUTEX). campfire.db.Database runs the
# writes, one at a time in BEGIN IMMEDIATE, so the writer pool needs one connection and no JTA.
# Readers open on demand up to DB_READERS.
sqlite.url=jdbc:sqlite:${campfire.storage}/db/production.sqlite3?busy_timeout=5000&foreign_keys=true&journal_mode=WAL&synchronous=NORMAL&journal_size_limit=67108864&cache_size=2000&open_mode=32774
quarkus.datasource.writer.db-kind=other
quarkus.datasource.writer.jdbc.driver=org.sqlite.JDBC
quarkus.datasource.writer.jdbc.url=${sqlite.url}
quarkus.datasource.writer.jdbc.max-size=1
quarkus.datasource.writer.jdbc.transactions=disabled
# Checkpoints are Database's job, off the commit path.
quarkus.datasource.writer.jdbc.new-connection-sql=PRAGMA wal_autocheckpoint=0
quarkus.datasource.readers.db-kind=other
quarkus.datasource.readers.jdbc.driver=org.sqlite.JDBC
quarkus.datasource.readers.jdbc.url=${sqlite.url}
quarkus.datasource.readers.jdbc.max-size=${DB_READERS:16}
quarkus.datasource.readers.jdbc.transactions=disabled
quarkus.datasource.readers.jdbc.new-connection-sql=PRAGMA query_only = true
# Pooled connections keep their prepared statements (see campfire.db.Database), so the pools never
# retire or re-validate them; connections to a local file don't go stale.
quarkus.datasource.writer.jdbc.idle-removal-interval=0S
quarkus.datasource.writer.jdbc.background-validation-interval=0S
quarkus.datasource.readers.jdbc.idle-removal-interval=0S
quarkus.datasource.readers.jdbc.background-validation-interval=0S
# "Can't detect if a connection survived an exception" for db-kind other: a local SQLite file's
# connections don't break.
quarkus.log.category."io.quarkus.agroal.runtime.AgroalConnectionConfigurer".level=ERROR

quarkus.http.port=${HTTP_PORT:80}
quarkus.http.host=0.0.0.0
quarkus.http.test-port=0
quarkus.http.limits.max-body-size=${campfire.max-request-body:16777216}
quarkus.http.limits.max-form-attribute-size=16M
quarkus.http.idle-timeout=60s
quarkus.http.so-reuse-port=true
quarkus.vertx.prefer-native-transport=true
quarkus.banner.enabled=false
quarkus.log.console.format=%d{yyyy-MM-dd'T'HH:mm:ss.SSS} %-5p [%c{1}] %s%e%n
# jOOQ's banner and tip of the day on first use.
quarkus.log.category."org.jooq.Constants".level=WARN

# Native image: templates' static text and the app's own resources.
# Classes whose static state (random generators, TLS contexts, executors, caches) must be built
# in the running process rather than baked into the image.
quarkus.native.additional-build-args=--initialize-at-run-time=campfire.rails.SecureRandoms,--initialize-at-run-time=campfire.integrations.webpush.Encryption,--initialize-at-run-time=campfire.integrations.net.Network$SystemHolder,--initialize-at-run-time=campfire.integrations.net.PinnedHttp,--initialize-at-run-time=campfire.integrations.opengraph.Opengraph,--initialize-at-run-time=campfire.view.FragmentCache,--initialize-at-run-time=campfire.view.PageDigest,--initialize-at-run-time=campfire.db.Database,--initialize-at-run-time=campfire.users.Users
quarkus.native.resources.includes=gg/jte/generated/**/*.bin,campfire/**,public/**,org/apache/tika/mime/*.xml
